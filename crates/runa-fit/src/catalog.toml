# Curated models for `runa fit --recommend` (P8.4).
#
# One single-file GGUF per entry: the header probe reads only the first file,
# so split models would hide most of their tensors. `ref` is the exact file
# to `runa pull`. `size` is the file size in bytes (Hub `?blobs=true`);
# `--offline` fits on it alone. `active` is the approximate bytes read per
# token for MoE models (size × active / total params); dense models omit it.
# `mmproj` is the projector file size, counted with `--use vision`.
# `tier`: 1 (small) … 4 (best in this list); ties rank by speed.

