# Curated models for `runa fit --recommend` (P8.4).
#
# One entry per model: single-file GGUFs use `ref` alone; split (sharded)
# models list part 2..N in `parts` and the probe sums tensor bytes across
# every part header (P10.10). `ref` is the exact file to `runa pull`.
# `size` is the file size in bytes — the parts' sum for split entries
# (Hub `?blobs=true`);
# `--offline` fits on it alone. `active` is the approximate bytes read per
# token for MoE models (size × active / total params); dense models omit it.
# `mmproj` is the projector file size, counted with `--use vision`.
# `tier`: 1 (small) … 4 (best in this list); ties rank by speed.
# `kv_mib_per_1k`: KV cache MiB per 1024 ctx tokens at f16 (measured once
# per entry with `runa fit --json --ctx 8192`; KV is exactly linear in ctx,
# `q8_0` halves it, `q4_0` quarters it). `compute_mib`: compute buffer MiB
# at ubatch 512 (linear in `n_ubatch`). `--offline` counts both (P10.7).

