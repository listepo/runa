bin.name = "runa"
args = ["daemon", "--help"]
status = "success"
stdout = """
Background service: warm models + Unix-socket server for `run`/`chat` (P9.1)

Usage: runa daemon [OPTIONS] [MODEL]

Arguments:
  [MODEL]  Local GGUF file to keep warm (single-model shorthand)

Options:
      --models <MODELS>          Additional GGUF paths (comma-separated or repeatable)
      --mode <MODE>              Compute mode: cpu | gpu | hybrid | auto [default: cpu]
      --ctx <CTX>                Context length [default: 4096]
      --max-loaded <MAX_LOADED>  Max models kept loaded (LRU unloads the rest)
      --lora <PATH[:SCALE]>      LoRA adapter GGUF (`path[:scale]`). Repeatable; applies to every daemon model
      --socket <SOCKET>          Socket path (default: `~/.cache/runa/runa.sock`)
      --install                  Write launchd/systemd units (needs a model) and exit
      --uninstall                Remove launchd/systemd units and exit
  -h, --help                     Print help
"""
