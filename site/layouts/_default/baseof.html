<!doctype html>
<html lang="{{ site.Language.Lang | default "en" }}" data-theme="system">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
    <script>
      (function () {
        try {
          var KEY = "runa-theme";
          var pref = localStorage.getItem(KEY) || "system";
          if (pref !== "light" && pref !== "dark" && pref !== "system") pref = "system";
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved = pref === "system" ? (dark ? "dark" : "light") : pref;
          document.documentElement.setAttribute("data-theme", pref);
          document.documentElement.setAttribute("data-theme-resolved", resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ "img/favicon.svg" | relURL }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
    <script defer src="{{ "js/theme.js" | relURL }}"></script>
  </head>
  <body class="min-h-dvh bg-bg font-sans text-fg antialiased">
    <a class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded focus:bg-accent focus:px-3 focus:py-2 focus:text-deep" href="#main">Skip to content</a>
    <header class="site-header sticky top-0 z-50 border-b">
      <div class="mx-auto flex h-[3.75rem] max-w-6xl items-center justify-between gap-4 px-5 sm:px-7">
        <a class="inline-flex items-center gap-2 font-mono text-[1.05rem] font-semibold tracking-tight text-fg no-underline hover:text-accent" href="{{ "" | relURL }}">
          <img class="size-8 rounded-lg" src="{{ "img/logo.svg" | relURL }}" width="32" height="32" alt="" aria-hidden="true">
          <span>runa</span>
        </a>
        <div class="flex items-center gap-2 sm:gap-4">
          <nav class="hidden items-center gap-4 text-sm font-medium text-muted sm:flex" aria-label="Primary">
            {{ range site.Menus.main }}
              {{ $external := strings.HasPrefix .URL "http" }}
              <a class="transition hover:text-accent" href="{{ .URL }}"{{ if $external }} rel="noopener"{{ end }}>{{ .Name }}</a>
            {{ end }}
          </nav>
          <button type="button" id="theme-toggle" class="theme-toggle" data-theme="system" aria-label="Theme: system (follows OS)" title="Cycle theme: system → light → dark">
            <svg class="theme-toggle-icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <svg class="theme-toggle-icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"/></svg>
            <svg class="theme-toggle-icon icon-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
            <span data-theme-label>system</span>
          </button>
        </div>
      </div>
    </header>
    <main id="main">{{ block "main" . }}{{ end }}</main>
    <footer class="mx-auto flex max-w-6xl flex-col gap-3 border-t border-line px-5 py-6 text-xs text-muted sm:flex-row sm:justify-between sm:px-7 sm:pb-10">
      <span class="font-mono">runa · local + cloud AI CLI</span>
      <a class="font-semibold text-accent no-underline hover:underline" href="{{ site.Params.repo }}" rel="noopener">GitHub ↗</a>
    </footer>
  </body>
</html>
