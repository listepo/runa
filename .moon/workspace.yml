# runa — moon workspace (plan K1, decisions D21/D22).
# Projects: the eight cargo crates (rust toolchain auto-detected) plus the
# workspace root (`moon.yml`, id `root`). Cargo remains the build source of
# truth; moon provides the task graph, caching and parallel execution.
projects:
  - 'crates/*/Cargo.toml'
  - 'moon.yml'

# Enforced moon version ↔ mise.toml ↔ docs/versions.md (D21).
versionConstraint: '>=2.5.4'

# runa ships no telemetry (M10); moon doesn't phone home either.
telemetry: false

vcs:
  client: 'git'
  provider: 'github'
  defaultBranch: 'main'
