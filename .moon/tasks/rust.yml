# Shared Rust tasks, inherited by every rust-toolchain project (plan K1, D20).
# Parallelism: cargo already uses all cores by default (max parallel jobs),
# and moon runs independent project targets concurrently, so a bare
# `moon run :test` builds/tests all eight crates in parallel with no
# manual `-j` flags. Cap parallelism only with a benchmark to justify it.
# No `outputs` are declared: cargo's target/ dir is gitignored and must not
# be archived into moon's cache.
inheritedBy:
  toolchains: ['rust']

fileGroups:
  sources:
    - 'src/**/*'
    - 'Cargo.toml'
    - 'build.rs'
  tests:
    - 'tests/**/*'
    - 'src/**/*'

tasks:
  build:
    description: 'cargo build for this crate'
    command: 'cargo build'
    inputs:
      - '@globs(sources)'
      - '/Cargo.toml'
      - '/Cargo.lock'

  test:
    description: 'cargo test for this crate'
    command: 'cargo test'
    deps: ['build']
    inputs:
      - '@globs(sources)'
      - '@globs(tests)'
      - '/Cargo.toml'
      - '/Cargo.lock'

  clippy:
    description: 'cargo clippy, warnings denied (CI parity)'
    command: 'cargo clippy --all-targets -- -D warnings'
    deps: ['build']
    inputs:
      - '@globs(sources)'
      - '/Cargo.toml'
      - '/Cargo.lock'

  fmt:
    description: 'cargo fmt check for this crate'
    command: 'cargo fmt -- --check'
    inputs:
      - '@globs(sources)'
