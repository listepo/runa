# Rust toolchain via moon's WASM plugin (plan K1, D21/D22).
# `version` MUST match the rust-toolchain.toml channel and the
# [workspace.package] rust-version in Cargo.toml — mirrored by hand (K2
# automates the drift check in CI). BOTH moon sync flags are OFF:
# `syncToolchainConfig` rewrites rust-toolchain.toml with an invalid
# `channel = "~1.98"` and strips the file's comments; `addMsrvConstraint`
# does the same to Cargo.toml's `rust-version`.
# Observed 2026-09-08: leaving either on corrupts the pins on every moon run
# that syncs a rust project. Tool installs come
# from mise (D21): the plugin (1.0.9) cannot download Rust toolchains
# (`download_prebuilt` unimplemented); it contributes graph/hashing/caching.
rust:
  version: '1.98'
  components: ['clippy', 'rustfmt']
  syncToolchainConfig: false
  addMsrvConstraint: false
