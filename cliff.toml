# git-cliff configuration. CHANGELOG.md is generated from git history, never
# edited by hand. `scripts/release.sh` runs this before the release commit.
# git-cliff is pinned in mise.toml (D16); run it as `mise exec -- git-cliff`.

[changelog]
# git-cliff writes this header itself, so no generated changelog can lose the
# marker. `@generated` is the marker linters and review tools look for.
header = """
<!-- @generated by git-cliff from cliff.toml — DO NOT EDIT. Regenerate: `mise exec -- git-cliff -o CHANGELOG.md`. -->
# Changelog

Generated by git-cliff from commit subjects (`mise exec -- git-cliff -o CHANGELOG.md`).
Do not edit by hand — change the commit or `cliff.toml` and regenerate.
Unreleased work is listed first; a `v*` tag starts a version section.

"""
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}- {{ commit.message | split(pat="\n") | first | trim }} (`{{ commit.id | truncate(length=7, end="") }}`)
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
# The `<!-- N -->` prefix orders the groups; `striptags` in the body hides it.
# Prefixes are the ones AGENTS.md §11 requires, scopes included (`ci(trial):`).
commit_parsers = [
  { message = "^feat(\\(|:)", group = "<!-- 0 -->Features" },
  { message = "^fix(\\(|:)", group = "<!-- 1 -->Fixes" },
  { message = "^docs(\\(|:)", group = "<!-- 2 -->Docs" },
  { message = "^(ci|build|chore|deps|style|test)(\\(|:)", group = "<!-- 3 -->Tooling" },
  # `release: vX.Y.Z` is bookkeeping the next release would otherwise list.
  { message = "^release:", skip = true },
  { message = ".*", group = "<!-- 4 -->Other" },
]