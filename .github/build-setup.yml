# Injected into cargo-dist's build-local-artifacts job (see dist-workspace.toml
# github-build-setup). Kept one level above .github/workflows so GitHub does not
# treat it as a standalone workflow. Regenerate release.yml after changing this:
#   bash scripts/cargo-dist.sh generate
# (dist-workspace.toml has no allow-dirty, so generate rewrites release.yml).
#
# P14.2: dist runners start without the developer toolchain — the first v0.1.0
# cut failed with `zig 0.16.0 (mise, D23): No such file or directory` because
# runa-kernels/build.rs shells out to `zig`. Install the same mise pins CI uses
# (K2/D21: rust 1.98, zig 0.16.0, …), so the release build matches `ci.yml`.
#
# Restore Cargo registry/git/target between releases. Upload always — release
# runners are few, and a warm cache cuts the multi-minute `dist build` on each
# target. Keyed per runner OS + job name so macOS and Linux do not collide.

- name: Install tools via mise (K2, D21)
  uses: jdx/mise-action@v2
  with:
    install: true

# P14.2: expose the real zig binary to build scripts. dist's build step runs
# under PowerShell on Windows, where the mise shims dir is not on PATH
# (mise-action adds it for bash steps only), so runa-kernels/build.rs cannot
# spawn `zig` there. `mise which zig` resolves through mise itself on every
# OS — export that as ZIG.
- name: Export ZIG for build scripts (P14.2)
  shell: bash
  run: |
    zigbin="$(mise which zig)"
    echo "mise which zig: $zigbin"
    if [ -x "$zigbin" ]; then
      echo "ZIG=$zigbin" >> "$GITHUB_ENV"
    else
      echo "mise which zig is not executable" >&2
      exit 1
    fi

- name: Cache Cargo build
  uses: Swatinem/rust-cache@v2
  with:
    shared-key: release-dist
    # Release builds are rare; always save so the next cut is warm.
    cache-on-failure: true
