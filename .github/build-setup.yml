# Injected into cargo-dist's build-local-artifacts job (see dist-workspace.toml
# github-build-setup). Kept one level above .github/workflows so GitHub does not
# treat it as a standalone workflow. Regenerate release.yml after changing this:
#   bash scripts/cargo-dist.sh generate
# (dist-workspace.toml has no allow-dirty, so generate rewrites release.yml).
#
# P14.2: dist runners start without the developer toolchain — the first v0.1.0
# cut failed with `zig 0.16.0 (mise, D23): No such file or directory` because
# runa-kernels/build.rs shells out to `zig`. Install the same mise pins CI uses
# (K2/D21: rust 1.98, zig 0.16.0, …), so the release build matches `ci.yml`.
#
# Restore Cargo registry/git/target between releases. Upload always — release
# runners are few, and a warm cache cuts the multi-minute `dist build` on each
# target. Keyed per runner OS + job name so macOS and Linux do not collide.

- name: Install tools via mise (K2, D21)
  uses: jdx/mise-action@v2
  with:
    install: true

# P14.2: expose the real zig binary to build scripts. dist's build step runs
# under PowerShell on Windows, where the mise shims dir is not on PATH
# (mise-action adds it for bash steps only), so runa-kernels/build.rs cannot
# spawn `zig` there. `mise which zig` resolves through mise itself on every
# OS — export that as ZIG.
- name: Export ZIG for build scripts (P14.2)
  shell: bash
  run: |
    zigbin="$(mise which zig)"
    echo "mise which zig: $zigbin"
    if [ -x "$zigbin" ]; then
      echo "ZIG=$zigbin" >> "$GITHUB_ENV"
    else
      echo "mise which zig is not executable" >&2
      exit 1
    fi

# P14.2: align the MSVC CRT between the two vendored ggml builds on the
# release profile. dist links the final binary /MD (dynamic CRT), and
# llama-cpp-sys-2 builds dynamic too (LLAMA_STATIC_CRT unset → static_crt
# (false)). whisper-rs-sys 0.15 never calls cmake's `.static_crt()`
# (default None → cc-rs static /MT), so the Release/Windows link died with
# LNK2038 (MT vs MD). The whisper half of the fix lives in
# `.cargo/config.toml` [env] (CMAKE_MSVC_RUNTIME_LIBRARY, always on);
# LLAMA_STATIC_CRT=0 below pins the llama half (its default is dynamic).
#

# How it travels: `.cargo/config.toml` [env] sets CMAKE_MSVC_RUNTIME_LIBRARY
# for every cargo invocation in this repo (CI, local, dist). whisper-rs-sys
# forwards every CMAKE_* env var as a `-D` define, so the value reaches its
# cmake configure step before the first `project()` call — the only ordering
# MSVC generators honor. LLAMA_STATIC_CRT=0 pins the llama side explicitly
# (its build.rs default is already dynamic); GITHUB_ENV persists it to the
# later build step (build.rs env must exist at compile time, unlike
# [env] which cargo sets for build scripts too — belt and braces).
- name: Align MSVC CRT for release C++ builds (P14.2, Windows only)
  if: runner.os == 'Windows'
  shell: bash
  run: echo "LLAMA_STATIC_CRT=0" >> "$GITHUB_ENV"

- name: Cache Cargo build
  uses: Swatinem/rust-cache@v2
  with:
    shared-key: release-dist
    # P14.2: v1 of this cache stored llama objects built with the static CRT
    # (MT_StaticRelease) while rustc links /MD — every later run restored the
    # poisoned objects and died with LNK2038. v2 (CMAKE_MSVC_RUNTIME_LIBRARY)
    # poisoned the other side (whisper rebuilt /MD against a stale /MT
    # llama cache). v3 = both sides /MD from a clean slate. Bump on any
    # CRT-affecting change.
    prefix-key: v3-crt-md-clean
    # Release builds are rare; always save so the next cut is warm.
    cache-on-failure: true
