# P13.3. The second way in: release-plz keeps a "release: vX.Y.Z" pull request
# open with the next version and the changelog; once it is merged, dispatch this
# workflow with mode=release and it starts the dist Release workflow through the
# same scripts/release.sh as bump.yml. Nobody types a version.
#
# Deviation from the rtok original (recorded deliberately): rtok runs this on
# every push to main and detects the merge of the release pull request in the
# commit message. runa runs no workflow on push to main (`7a1f78f` disabled the
# push triggers for ci.yml and perf.yml), so this is `workflow_dispatch` only
# and `mode` says which half to run:
#   release-pr  open or refresh the release pull request
#   release     dispatch release.yml for the version Cargo.toml already carries
#
# release-plz creates neither the tag nor the GitHub Release — dist does both
# from release.yml — and reads the tag dist pushes to learn that a version is
# out (release-plz.toml). docs/release.md records the measured caveat that
# comes with `publish = false`.
#
# RELEASE_PLZ_TOKEN (a fine-grained PAT: contents + pull requests, write) is
# required, not optional: GitHub starts no workflow from a GITHUB_TOKEN event,
# so a release pull request opened with the default token would be merged
# having never run ci.yml. The job checks for it and fails loudly.
name: release-plz

on:
  workflow_dispatch:
    inputs:
      mode:
        description: open or refresh the release pull request, or release the merged version
        default: release-pr
        type: choice
        options: [release-pr, release]

permissions:
  contents: write # the release branch
  pull-requests: write # the release pull request
  actions: write # dispatch release.yml

concurrency:
  group: release-plz
  cancel-in-progress: false

jobs:
  release-pr:
    if: inputs.mode == 'release-pr'
    runs-on: ubuntu-22.04
    steps:
      # Without the token, `release-plz/action` still opens the pull request —
      # with GITHUB_TOKEN, whose events GitHub refuses to start workflows from.
      # The pull request then carries no CI at all, and the only sign is a
      # checks list that is empty rather than red. Fail here, where the cause is
      # written down. https://release-plz.dev/docs/github/token
      - name: A token that gives the release pull request its CI
        env:
          TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "RELEASE_PLZ_TOKEN is not set." >&2
            echo "A pull request opened with the default GITHUB_TOKEN starts no workflows," >&2
            echo "so the release would be merged without ci.yml ever having run on it." >&2
            echo "Set a fine-grained PAT with contents + pull-requests write." >&2
            echo "See https://release-plz.dev/docs/github/token" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history decide the next version
      # cargo from mise.toml, same as local and ci.yml.
      - uses: jdx/mise-action@v2
        with:
          install: true
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # The same gate every pull request passes, on the merge commit this release is
  # cut from.
  verify:
    if: inputs.mode == 'release'
    uses: ./.github/workflows/verify.yml

  release:
    needs: [verify]
    if: inputs.mode == 'release'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: jdx/mise-action@v2
        with:
          install: true
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: release
      - name: Start the dist Release workflow for the merged version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --no-bump: dispatch the version Cargo.toml already carries; never raise
        # it here (the raise belongs to the release pull request).
        run: bash scripts/release.sh patch --no-bump