# GPU feature variants (P6.3). cargo-dist ships portable CPU archives;
# this workflow adds Metal / Vulkan / CUDA binaries to the same GitHub Release.
#
# CUDA needs the NVIDIA toolkit on the runner. Vulkan needs libvulkan-dev.

name: release-variants

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag whose GitHub Release should receive extra archives
        required: true

jobs:
  macos-metal:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: Build Metal variant
        run: cargo build --release -p runa --features metal
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist-variant
          cp target/release/runa dist-variant/runa
          tar -C dist-variant -cJf "runa-aarch64-apple-darwin-metal.tar.xz" runa
      - name: Wait for GitHub Release then upload
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" runa-aarch64-apple-darwin-metal.tar.xz --clobber
              exit 0
            fi
            sleep 15
          done
          echo "timed out waiting for GitHub Release $TAG" >&2
          exit 1

  linux-vulkan:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Vulkan headers
        run: sudo apt-get update && sudo apt-get install -y libvulkan-dev
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: Build Vulkan variant
        run: cargo build --release -p runa --features vulkan
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist-variant
          cp target/release/runa dist-variant/runa
          tar -C dist-variant -cJf "runa-x86_64-unknown-linux-gnu-vulkan.tar.xz" runa
      - name: Wait for GitHub Release then upload
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" runa-x86_64-unknown-linux-gnu-vulkan.tar.xz --clobber
              exit 0
            fi
            sleep 15
          done
          echo "timed out waiting for GitHub Release $TAG" >&2
          exit 1

  linux-cuda:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: "12.4.0"
          method: network
      - uses: jdx/mise-action@v2
        with:
          install: true
      - name: Build CUDA variant
        run: cargo build --release -p runa --features cuda
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist-variant
          cp target/release/runa dist-variant/runa
          tar -C dist-variant -cJf "runa-x86_64-unknown-linux-gnu-cuda.tar.xz" runa
      - name: Wait for GitHub Release then upload
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" runa-x86_64-unknown-linux-gnu-cuda.tar.xz --clobber
              exit 0
            fi
            sleep 15
          done
          echo "timed out waiting for GitHub Release $TAG" >&2
          exit 1
