# P13.3. The gate `ci.yml` applies to every pull request, applied once more to
# the commit a release is cut from. A release is the one build nobody can
# re-run for themselves: a broken binary on the releases page is installed
# before anyone notices.
#
# It runs in the two workflows that dispatch `release.yml` (`bump.yml`,
# `release-plz.yml`), not inside `release.yml` itself. dist creates the tag and
# a draft Release in its `plan` job and lets `host` proceed when
# `build-local-artifacts` is `skipped` — which is what a failed dist custom job
# produces — so a gate in there would publish an empty Release rather than stop
# one. Here a red gate means no dispatch, no tag, and nothing on the releases
# page.
#
# Same matrix and same recipes as `ci.yml`, deliberately: a gate that tests
# something narrower than the one every pull request passed is a gate that lets
# through what that one caught. The only steps not repeated here are the CI
# cache forensics (`sccache --show-stats`) and the fixture cleanup, which exist
# for runner hygiene, not for correctness.
name: verify

on:
  # Called by the two release entry points.
  workflow_call:
  # And runnable on its own: the gate has to be provable before a release is
  # cut, and runa runs no workflow on push, so this is the only way to see it
  # green on a branch.
  workflow_dispatch:

jobs:
  verify:
    name: ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    # Same CI-only profile tuning as ci.yml (P11.8).
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Install tools via mise (K2, D21)
        uses: jdx/mise-action@v2
        with:
          install: true

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: verify

      - name: dist generate --check (P6.3)
        # The release workflow must match dist-workspace.toml before it is
        # dispatched: this is the one moment wrong config would ship.
        if: runner.os == 'Linux'
        run: dist generate --mode=ci --check

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace -- -D warnings

      - name: cargo build --workspace
        run: cargo build --workspace

      - name: cargo test --workspace (CPU tests)
        run: cargo test --workspace --lib

      - name: fetch qwen2 fixture (P0.7, git-ignored weights)
        if: runner.os != 'Windows'
        run: |
          test -f tests/fixtures/qwen2-0_5b-instruct-q4_0.gguf || curl -fSL --retry 3 -o tests/fixtures/qwen2-0_5b-instruct-q4_0.gguf https://huggingface.co/Qwen/Qwen2-0.5B-Instruct-GGUF/resolve/main/qwen2-0_5b-instruct-q4_0.gguf

      - name: fixture size guard (<=3 GiB)
        run: python3 scripts/check-fixture-size.py

      - name: runa serve e2e + OpenAI Python SDK smoke (P3.9)
        if: runner.os != 'Windows'
        env:
          RUNA_REQUIRE_OPENAI_SMOKE: "1"
        run: |
          python3 -m pip install --user 'openai>=1.40,<3' 'anthropic>=0.40,<1'
          cargo test -p runa --test e2e serve_ -- --nocapture --test-threads=1

      - name: registry lint (docs/tasks.md)
        run: python3 scripts/lint-tasks.py docs/tasks.md

      - name: perf-regress self-test (P5.8)
        run: python3 scripts/perf-regress.py --self-test

      - name: NPU stub features resolve (P9.4 Tier-3)
        run: |
          cargo check -p runa-engine --features hexagon,openvino
          cargo test -p runa --features hexagon,openvino --test doctor

      - name: RPC backend feature (P9.3)
        run: |
          cargo test -p runa-engine -p runa --features runa/rpc --lib --test rpc --test doctor --test trycmd

      - name: runa-memory regression (P7.1/P7.4)
        run: cargo test -p runa-memory